<style>
:root {
  --bg1:#0f172a; --bg2:#1e1b4b; --bg3:#312e81;
  --ink:#f8fafc; --muted:#c7d2fe; --accent:#a78bfa; --accent2:#38bdf8;
}
html, body { height:100%; }
.reveal-viewport {
  background: radial-gradient(1200px 800px at 15% 10%, var(--bg3) 0%, transparent 55%),
              radial-gradient(1000px 700px at 90% 90%, #4c1d95 0%, transparent 50%),
              linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
}
.reveal { font-family:'Inter',system-ui,sans-serif; color:var(--ink); font-size:30px; }
.reveal .slides { text-align:left; }
.reveal .slides section { padding:0 24px; }
.reveal h1, .reveal h2, .reveal h3 {
  font-family:'Poppins',sans-serif; color:#fff; text-transform:none;
  letter-spacing:-.01em; line-height:1.1; text-shadow:0 2px 18px rgba(0,0,0,.35);
}
.reveal h1 { font-size:2.4em; font-weight:800;
  background:linear-gradient(90deg,#fff, var(--muted));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.reveal h2 { font-size:1.5em; font-weight:700; margin-bottom:.5em;
  border-left:6px solid var(--accent); padding-left:.5em; }
.reveal p, .reveal li { color:var(--ink); line-height:1.45; }
.reveal strong { color:var(--accent2); }
.reveal em { color:var(--muted); }
.reveal ul { display:block; margin-left:.2em; }
.reveal ul li { margin:.35em 0; list-style:none; position:relative; padding-left:1.3em; }
.reveal ul li::before { content:'▸'; position:absolute; left:0; color:var(--accent); font-weight:700; }
.reveal a { color:var(--accent2); }
/* imagenes de contenido */
.reveal .deck-img {
  display:block; margin:.6em auto 0; max-height:42vh; max-width:88%;
  border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12); object-fit:cover;
}
/* portada: primer slide centrado */
.reveal .slides > section:first-child { text-align:center; }
.reveal .slides > section:first-child h1 { margin-bottom:.2em; }
.reveal .slides > section:first-child p { color:var(--muted); font-size:1.1em; }
/* referencias APA7: sangria francesa */
.reveal .references { font-size:.62em; }
.reveal .references p {
  text-indent:-2.2em; padding-left:2.2em; margin:.55em 0; line-height:1.35;
  color:var(--muted); text-align:left;
}
.reveal .slide-number { background:transparent; color:var(--muted); }
</style>

<div class="reveal"><div class="slides">

<textarea data-template>
# El sistema solar
### Nuestro vecindario cósmico

---

## ¿Qué es el sistema solar?
- Conjunto de Sol, planetas, lunas y cuerpos menores.
- Orbita en el centro de la Vía Láctea.
- Se formó hace unos 4.600 millones de años.
<img class="deck-img" src="https://image.pollinations.ai/prompt/Photorealistic%20view%20of%20the%20Sun%20at%20the%20center%20with%20planets%20orbiting%20in%20a%20spiral%20disk%20of%20dust%20and%20gas.?width=1024&height=576&nologo=true&seed=55433" alt="Photorealistic view of the Sun at the center with planets orbiting in a spiral disk of dust and gas." loading="lazy">

---

## El Sol y los planetas
- El Sol concentra el 99,8% de la masa del sistema.
- Hay cuatro planetas rocosos y cuatro gigantes.
- Los planetas giran en órbitas casi planas.
<img class="deck-img" src="https://image.pollinations.ai/prompt/Photorealistic%20close-up%20of%20the%20Sun%20with%20Mercury%2C%20Venus%2C%20Earth%20and%20Mars%20visible%20in%20the%20foreground.?width=1024&height=576&nologo=true&seed=17824" alt="Photorealistic close-up of the Sun with Mercury, Venus, Earth and Mars visible in the foreground." loading="lazy">

---

## Cuerpos menores y lunas
- Asteroides, cometas y planetas enanos.
- El cinturón de asteroides separa Marte y Júpiter.
- Las lunas orbitan a planetas y enanos.
<img class="deck-img" src="https://image.pollinations.ai/prompt/Photorealistic%20asteroid%20belt%20with%20rocky%20fragments%20and%20a%20comet%20tail%20in%20deep%20space.?width=1024&height=576&nologo=true&seed=77922" alt="Photorealistic asteroid belt with rocky fragments and a comet tail in deep space." loading="lazy">

---

## Exploración del sistema solar
- Misiones robóticas y sondas espaciales.
- Observan planetas, lunas y el Sol.
- Ayudan a entender su origen y evolución.
<img class="deck-img" src="https://image.pollinations.ai/prompt/Photorealistic%20spacecraft%20flying%20past%20a%20planet%20with%20a%20ring%20system%20and%20Earth%20in%20the%20distance.?width=1024&height=576&nologo=true&seed=87772" alt="Photorealistic spacecraft flying past a planet with a ring system and Earth in the distance." loading="lazy">
