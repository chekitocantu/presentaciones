# El Océano Pacífico

El océano más grande y profundo del planeta

---

## Datos generales

- **Superficie:** 165,2 millones de km² (31,8% del planeta)
- **Superficie total de agua:** 46,16 millones de km³
- **Profundidad media:** 4 028 m
- **Punto más profundo:** Fosa de las Marianas (10 994 m, Challenger Deep)
- **Temperatura media del agua:** 21 °C

---

## Límites geográficos

- **Al norte:** Círculo Polar Ártico y Ártico
- **Al sur:** Antártida
- **Al este:** América (Costa Rica y Sudamérica)
- **Al oeste:** Asia y Oceanía
- **Conexión con otros océanos:**
  - Océano Atlántico → Estrecho de Béring y Sudamérica
  - Océano Índico → Indonesia
  - Océano Antártico → paso de Drake

---

## Divisiones del océano

- **Pacífico Norte**
  - Mar de Ojotsk
  - Mar de Bering
  - Mar de Japón
  - Mar de la China Oriental
  - Mar de la China Meridional
  - Mar de Filipinas
- **Pacífico Sur**
  - Mar de Coral
  - Mar de Tasman
  - Mar de Salomon

---

## Características geológicas

- **Fosa de las Marianas:** 10 994 m, el punto más profundo del mundo
- **Cadena de Islas Aleutianas**
- **Cinturón de Fuego:** zona sísmica y volcánica en el borde oriental (más de 75% de los volcanes activos)
- **Placas tectónicas:** Pacífica, de Nazca, de Cocos, de Filipinas, etc.
- **Arco de islas volcánicas**
- **Plataformas submarinas**

---

## Corrientes y clima

- **Corriente del Niño (ENOS):** calienta el Pacífico tropical ecuatorial
- **Corriente de El Niño / La Niña:** fenómenos de variabilidad climática
- **Corriente de Humboldt:** corriente fría en el Pacífico sur
- **Corriente Kuroshio:** corriente cálida en el Pacífico norte
- **Circulación oceánica global:** el Pacífico es fundamental para el clima mundial
- **Alisios:** vientos constantes que impulsan las corrientes superficiales

---

## Biodiversidad

- **Mariposas de agua (corales):** arrecifes de coral (Triángulo de Coral en Indonesia)
- **Mamíferos marinos:** ballenas, delfines, manatíes
- **Aves:** pelícanos, albatros, gaviotas
- **Peces comerciales:** atún, caballa, jurel, salmón
- **Especie en peligro:** delfín rosado, tiburón blanco
- **Bolsa de pobreza biológica:** zonas de alta productividad

---

## Importancia económica

- **Pesca:** principal fuente de proteínas para más de 200 millones de personas
- **Transporte marítimo:** ruta de Asia-Afrique-Australia
- **Turismo:** Maldivas, Fiji, Tailandia
- **Extracción de petróleo y gas**
- **Cultivos de mariscos:** perlas, cangrejo azul
- **Energía eólica marina**

---

## Problemas ambientales

- **Basura marina:** Gran Mancha de Basura del Pacífico Norte (más de 1,5 millones de toneladas)
- **Cambio climático:** calentamiento del agua, aumento del nivel del mar
- **Acidificación de los océanos**
- **Sobrepesca**
- **Bleaching (blanqueamiento) de corales**
- **Plásticos:** microplásticos que afectan la cadena alimentaria

---

## Conclusión

El océano Pacífico es vital para el equilibrio ecológico y el desarrollo económico del planeta. Su conservación requiere acción global: reducir emisiones, controlar la contaminación marina y gestionar las pesquerías de forma sostenible.
