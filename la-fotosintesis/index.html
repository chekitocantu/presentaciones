  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.reveal h2 { font-size:1.5em; font-weight:700; margin-bottom:.5em;
  border-left:6px solid var(--accent); padding-left:.5em; }
.reveal p, .reveal li { color:var(--ink); line-height:1.45; }

.reveal em { color:var(--muted); }

.reveal ul li::before { content:'▸'; position:absolute; left:0; color:var(--accent); font-weight:700; }
.reveal a { color:var(--accent2); }
/* imagenes de contenido (Markdown ![](url)): al lado del texto (fluye a la izquierda) */
.reveal .slides section img {
  float:right; width:40%; max-width:40%; max-height:64vh;
  margin:.1em 0 .6em 1.1em; min-height:8em;
  border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12); object-fit:cover;
  /* mientras carga: panel de color (no blanco) */
  background:linear-gradient(135deg, var(--bg3), #4c1d95);
}
.reveal .slides section img.img-failed { display:none; }  /* si Pollinations falla, ocultar (JS) */

/* portada: primer slide centrado (la imagen, si la hay, no flota) */
.reveal .slides > section:first-child { text-align:center; }
.reveal .slides > section:first-child h1 { margin-bottom:.2em; }

# La Fotosíntesis: La Base de la Vida
### Cómo las plantas transforman la luz en energía vital

---

## El Proceso Fundamental
- La fotosíntesis es la **conversión** de energía lumínica en energía química.
- Realizada principalmente por plantas, algas y algunas bacterias.
- Esencial para la **vida** en la Tierra, produciendo oxígeno y alimento.

![](https://image.pollinations.ai/prompt/a%20realistic%20photograph%20of%20a%20vibrant%20green%20leaf%20with%20visible%20veins%2C%20illuminated%20by%20sunlight%2C%20showing%20tiny%20water%20droplets%20on%20its%20surface?width=1024&height=768&nologo=true&seed=50707)


---

## Componentes Clave
- **Clorofila**: Pigmento verde que absorbe la luz solar.
- **Cloroplastos**: Organelos celulares donde ocurre la fotosíntesis.
- Agua (H2O) y Dióxido de Carbono (CO2) son los **reactivos** principales.

![](https://image.pollinations.ai/prompt/a%20close-up%20photograph%20of%20a%20plant%20cell%20showing%20clearly%20defined%20chloroplasts%2C%20with%20a%20focus%20on%20their%20internal%20structure?width=1024&height=768&nologo=true&seed=40896)


---

## Fases de la Fotosíntesis
- **Fase Luminosa**: La luz se convierte en ATP y NADPH en los tilacoides.
- Se libera **oxígeno** como subproducto de la división del agua.
- Requiere directamente la **energía solar**.

![](https://image.pollinations.ai/prompt/a%20detailed%20photograph%20of%20the%20thylakoid%20membranes%20within%20a%20chloroplast%2C%20with%20light%20particles%20appearing%20to%20interact%20with%20them?width=1024&height=768&nologo=true&seed=56375)


---

## Ciclo de Calvin (Fase Oscura)
- Utiliza el ATP y NADPH de la fase luminosa.
- **Fija** el dióxido de carbono para producir glucosa (azúcares).
- Ocurre en el **estroma** del cloroplasto, sin necesidad directa de luz.

![](https://image.pollinations.ai/prompt/a%20photograph%20of%20a%20complex%20molecular%20structure%20representing%20glucose%2C%20surrounded%20by%20abstract%20elements%20suggesting%20energy%20conversion?width=1024&height=768&nologo=true&seed=61996)


---

## Importancia Ecológica
- Produce el **oxígeno** que respiramos y la base de la cadena alimentaria.
- Reduce el **dióxido de carbono** atmosférico, mitigando el cambio climático.
- Sostiene la **biodiversidad** y los ecosistemas terrestres y acuáticos.

![](https://image.pollinations.ai/prompt/a%20panoramic%20photograph%20of%20a%20lush%2C%20dense%20rainforest%20canopy%2C%20bathed%20in%20bright%20sunlight%2C%20emphasizing%20the%20abundance%20of%20plant%20life?width=1024&height=768&nologo=true&seed=52929)

<script>
Reveal.initialize({ hash:true, slideNumber:'c/t', transition:'slide',
  progress:true, controls:true, center:false,
  plugins:[ RevealMarkdown, RevealHighlight ] }).then(function() {
  // Pollinations (gratis) LIMITA rafagas: si las 6 imagenes se piden a la vez, casi
  // todas fallan. Estrategia: NO cargar de golpe -> mover src a data-src y cargar solo
  // la del slide visible (y la siguiente) al mostrarse. Reintento escalonado por si
  // una falla (la 2a vez suele venir de cache, rapida). Markdown ![](url) no permite
  // onerror inline, por eso se engancha aqui.
  var imgs = document.querySelectorAll('.reveal .slides section img');
  imgs.forEach(function(img) { img.dataset.src = img.src; img.removeAttribute('src'); });
  function load(sec) {
    if (!sec) return;
    sec.querySelectorAll('img[data-src]').forEach(function(img) {
      var url = img.dataset.src; img.removeAttribute('data-src');
      var tries = 0;
      img.addEventListener('error', function() {
        if (tries++ < 6) { setTimeout(function() { img.src = ''; img.src = url; }, 1200 * tries); }
        else { img.classList.add('img-failed'); }
      });
      img.src = url;
    });
  }
  Reveal.on('slidechanged', function(e) { load(e.currentSlide); load(e.currentSlide.nextElementSibling); });
  load(Reveal.getCurrentSlide());
  load(document.querySelectorAll('.reveal .slides section')[1]);  // precargar el 1er contenido
});
</script>
