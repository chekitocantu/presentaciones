<head>
<meta charset="utf-8">

<title>los agujeros negros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme">
<style>
:root {
  --bg1:#0f172a; --bg2:#1e1b4b; --bg3:#312e81;
  --ink:#f8fafc; --muted:#c7d2fe; --accent:#a78bfa; --accent2:#38bdf8;
}
html, body { height:100%; }
.reveal-viewport {
  background: radial-gradient(1200px 800px at 15% 10%, var(--bg3) 0%, transparent 55%),
              radial-gradient(1000px 700px at 90% 90%, #4c1d95 0%, transparent 50%),
              linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
}
.reveal { font-family:'Inter',system-ui,sans-serif; color:var(--ink); font-size:30px; }
.reveal .slides { text-align:left; }
.reveal .slides section { padding:0 24px; }
.reveal h1, .reveal h2, .reveal h3 {
  font-family:'Poppins',sans-serif; color:#fff; text-transform:none;
  letter-spacing:-.01em; line-height:1.1; text-shadow:0 2px 18px rgba(0,0,0,.35);
}
.reveal h1 { font-size:2.4em; font-weight:800;
  background:linear-gradient(90deg,#fff, var(--muted));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.reveal h2 { font-size:1.5em; font-weight:700; margin-bottom:.5em;
  border-left:6px solid var(--accent); padding-left:.5em; }
.reveal p, .reveal li { color:var(--ink); line-height:1.45; }
.reveal strong { color:var(--accent2); }
.reveal em { color:var(--muted); }
.reveal ul { display:block; margin-left:.2em; }
.reveal ul li { margin:.35em 0; list-style:none; position:relative; padding-left:1.3em; }
.reveal ul li::before { content:'▸'; position:absolute; left:0; color:var(--accent); font-weight:700; }
.reveal a { color:var(--accent2); }
/* imagenes de contenido */
.reveal .deck-img {
  display:block; margin:.6em auto 0; max-height:42vh; max-width:88%;
  border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12); object-fit:cover;
}
/* portada: primer slide centrado */
.reveal .slides > section:first-child { text-align:center; }
.reveal .slides > section:first-child h1 { margin-bottom:.2em; }
.reveal .slides > section:first-child p { color:var(--muted); font-size:1.1em; }
/* referencias APA7: sangria francesa */
.reveal .references { font-size:.62em; }
.reveal .references p {
  text-indent:-2.2em; padding-left:2.2em; margin:.55em 0; line-height:1.35;
  color:var(--muted); text-align:left;
}
.reveal .slide-number { background:transparent; color:var(--muted); }
</style>
</head>
<body>
<div class="reveal"><div class="slides">
<section data-markdown data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n--\r?\n$">
<textarea data-template>
# Agujeros negros
### Enigmas del espacio

---

## ¿Qué son?
- Regiones del espacio con gravedad extrema
- Ni la luz puede escapar
- Formados por colapso de estrellas masivas
<img class="deck-img" src="https://image.pollinations.ai/prompt/A%20black%20hole%20silhouette%20with%20glowing%20accretion%20disk%20and%20gravitational%20lensing%2C%20deep%20space%20background%2C%20photographic%20style?width=1024&height=576&nologo=true&seed=15212" alt="A black hole silhouette with glowing accretion disk and gravitational lensing, deep space background, photographic style" loading="lazy">

---

## Tipos principales
- Estelares: nacidos de estrellas
- Supermasivos: en centros galácticos
- Intermedios y primordiales: menos comunes
<img class="deck-img" src="https://image.pollinations.ai/prompt/Comparison%20of%20stellar%20and%20supermassive%20black%20holes%20with%20glowing%20disks%2C%20cosmic%20scale%2C%20photographic%20style?width=1024&height=576&nologo=true&seed=49781" alt="Comparison of stellar and supermassive black holes with glowing disks, cosmic scale, photographic style" loading="lazy">

---

## Evidencia y observación
- Órbitas de estrellas cercanas al centro galáctico
- Ondas gravitacionales detectadas por LIGO
- Imagen directa de M87* por EHT
<img class="deck-img" src="https://image.pollinations.ai/prompt/Event%20Horizon%20Telescope%20array%20and%20black%20hole%20image%20with%20bright%20ring%2C%20scientific%20observation%2C%20photographic%20style?width=1024&height=576&nologo=true&seed=22273" alt="Event Horizon Telescope array and black hole image with bright ring, scientific observation, photographic style" loading="lazy">

---

## Efectos y paradojas
- Dilatación del tiempo cerca del horizonte
- Radiación de Hawking teórica
- Paradoja de la información cuántica
<img class="deck-img" src="https://image.pollinations.ai/prompt/Spacetime%20curvature%20around%20a%20black%20hole%20with%20light%20bending%20and%20time%20distortion%2C%20dramatic%20cosmic%20scene%2C%20photographic%20style?width=1024&height=576&nologo=true&seed=16743" alt="Spacetime curvature around a black hole with light bending and time distortion, dramatic cosmic scene, photographic style" loading="lazy">

---
