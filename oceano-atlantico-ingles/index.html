# The Atlantic Ocean

---

## Overview
- Second-largest ocean in the world
- Spans from the Arctic in the north to the Southern Ocean in the south
- Separates the Americas from Europe and Africa

---

## Key Features
- **Mid-Atlantic Ridge**: A massive underwater mountain range
- **Gulf Stream**: A powerful warm current affecting climate in Western Europe
- **Deep Trenches**: Including the Puerto Rico Trench (one of the deepest points on Earth)

---

## Biodiversity
- Home to whales, dolphins, sharks, and countless fish species
- Rich coral reefs in tropical regions
- Vital for global marine life cycles

---

## Human Impact
- Major shipping route between continents
- Oil and gas extraction in offshore zones
- Plastic pollution and overfishing threaten ecosystems

---

## Fun Facts
- Covers about 20% of Earth's surface
- Named after the mythical 'Atlantis' by ancient Greeks
- Its name comes from the Greek word 'Atlantis', meaning 'island of Atlas'
