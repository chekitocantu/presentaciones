# Atlantic Ocean

---

## Overview
- Second-largest ocean in the world
- Covers about 20% of Earth's surface
- Separates the Americas from Europe and Africa

---

## Key Features
- **Mid-Atlantic Ridge**: Underwater mountain range
- **Gulf Stream**: Warm current affecting climate in Europe
- **Deep trenches**: Including the Puerto Rico Trench (deepest in the Atlantic)

---

## Marine Life
- Home to whales, dolphins, sharks, and countless fish species
- Rich in plankton, forming the base of the food chain
- Coral reefs in tropical regions (e.g., Caribbean)

---

## Human Impact
- Major shipping route connecting continents
- Oil and gas extraction in offshore regions
- Plastic pollution and overfishing threaten ecosystems

---

## Climate Influence
- Regulates global climate through ocean currents
- Absorbs large amounts of CO₂
- Plays a key role in weather patterns (e.g., hurricanes)

---

## Fun Facts
- The Atlantic is widening by about 2.5 cm per year due to tectonic activity
- The name "Atlantic" comes from Greek mythology (Atlas, the Titan who held up the sky)
- It’s the youngest of the world’s major oceans, formed about 180 million years ago
