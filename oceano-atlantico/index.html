# Océano Atlántico

---

## Ubicación y Extensión
- Segundo océano más grande del mundo
- Separa las Américas de Europa y África
- Se extiende desde el Ártico hasta la Antártida

---

## Características Geográficas
- Tiene forma de letra 'S' invertida
- Incluye mares marginales como el Caribe
- Posee fosas abisales muy profundas

---

## Corrientes y Clima
- La corriente del Golfo modera el clima
- Genera huracanes en el Atlántico Norte
- Es clave para el equilibrio térmico global

---

## Importancia Económica
- Rutas comerciales internacionales vitales
- Extracción de petróleo y gas
- Actividad pesquera significativa

---

## Biodiversidad
- Alberga ballenas, tiburones y tortugas
- Ecosistemas de arrecifes de coral
- Diversa fauna en aguas profundas
