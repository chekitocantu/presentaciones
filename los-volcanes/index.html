# Los volcanes
### Fenómenos que destruyen y construyen la Tierra

---

## Qué es un volcán
- Un **volcán** es una abertura en la corteza terrestre por donde sale magma.
- El magma se convierte en lava al llegar a la superficie.
- Puede expulsar gases, cenizas y fragmentos rocosos.
- Su actividad depende del tipo de placa tectónica.
<img class="deck-img" src="https://image.pollinations.ai/prompt/A%20volcanic%20crater%20at%20dawn%20with%20steam%20rising%20from%20a%20rocky%20rim%2C%20dramatic%20side%20lighting%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=55376" alt="A volcanic crater at dawn with steam rising from a rocky rim, dramatic side lighting, no people" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---

## Cómo ocurre una erupción
- La presión del magma y los gases fuerza la roca hacia arriba.
- La viscosidad del magma determina si el flujo es suave o explosivo.
- Las erupciones efusivas emiten coladas; las explosivas lanzan **tefras**.
- El tipo de erupción depende de la composición y la cantidad de gas.
<img class="deck-img" src="https://image.pollinations.ai/prompt/An%20explosive%20volcanic%20eruption%20at%20night%20with%20glowing%20lava%20fragments%20rising%20above%20a%20dark%20cone%2C%20thick%20smoke%20plume%2C%20dramatic%20low-angle%20light%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=14209" alt="An explosive volcanic eruption at night with glowing lava fragments rising above a dark cone, thick smoke plume, dramatic low-angle light, no people" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---

## Tipos de volcanes
- Los **estratovolcanes** son altos y con erupciones violentas.
- Los **escudos** tienen coladas fluidas y pendientes suaves.
- Las **calderas** se forman por colapso tras grandes erupciones.
- Los domos y conos de ceniza son formas menores.
<img class="deck-img" src="https://image.pollinations.ai/prompt/A%20layered%20stratovolcano%20with%20a%20snow-capped%20peak%20and%20a%20broad%20shield%20volcano%20in%20the%20background%20under%20clear%20blue%20sky%2C%20morning%20light%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=17967" alt="A layered stratovolcano with a snow-capped peak and a broad shield volcano in the background under clear blue sky, morning light, no people" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---

## Peligros y riesgos
- Las **lahares** son flujos de ceniza y agua que destruyen valles.
- Las cenizas pueden dañar aviones, cultivos y sistemas respiratorios.
- Los gases volcánicos pueden ser tóxicos a gran concentración.
- El riesgo depende de la población, el terreno y la distancia.
<img class="deck-img" src="https://image.pollinations.ai/prompt/A%20volcanic%20mudflow%20of%20gray%20ash%20and%20water%20rushing%20through%20a%20forested%20valley%2C%20wet%20debris%20covering%20trees%2C%20overcast%20light%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=98750" alt="A volcanic mudflow of gray ash and water rushing through a forested valley, wet debris covering trees, overcast light, no people" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---

## Beneficios y monitoreo
- Las cenizas enriquecen suelos y favorecen la **agricultura**.
- El calor volcánico puede usarse para energía geotérmica.
- Los volcanes generan minerales y paisajes de alto valor turístico.
- Se monitorean con sismómetros, GPS y satélites para emitir alertas.
<img class="deck-img" src="https://image.pollinations.ai/prompt/A%20geothermal%20field%20with%20steam%20vents%20near%20a%20volcanic%20lake%2C%20colorful%20mineral%20deposits%2C%20morning%20mist%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=64029" alt="A geothermal field with steam vents near a volcanic lake, colorful mineral deposits, morning mist, no people" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
