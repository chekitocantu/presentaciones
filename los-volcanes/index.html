# Los volcanes
### Fenómenos que modelan la Tierra y condicionan la vida
---
## ¿Qué es un volcán?
- Un volcán es una abertura en la corteza por donde sale **magma**, gas y ceniza.
- El magma que emerge a la superficie se llama **lava** y puede formar conos, domos o coladas.
- Se clasifican como activos, dormidos o extintos según su historia eruptiva.
- La Etna, en Sicilia, es uno de los volcanes activos más estudiados del mundo.

<img class="deck-img" src="https://image.pollinations.ai/prompt/close-up%20photograph%20of%20an%20active%20volcanic%20crater%20with%20glowing%20orange%20lava%2C%20dark%20basalt%20rocks%2C%20and%20thin%20steam%20rising%20under%20dramatic%20side%20light?width=1024&height=768&nologo=true&model=flux&seed=20281" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---
## ¿Por qué se forman?
- La mayoría nace donde las **placas tectónicas** convergen, divergen o se separan.
- En las zonas de subducción, el océano hunde placa y genera fusión en el manto.
- En dorsales oceánicas, la separación de placas deja ascender magma basáltico.
- Los puntos calientes, como Hawái, crean cadenas de islas volcánicas.

<img class="deck-img" src="https://image.pollinations.ai/prompt/aerial%20photograph%20of%20a%20chain%20of%20dark%20volcanic%20islands%20in%20deep%20blue%20ocean%2C%20with%20a%20central%20active%20cone%20emitting%20a%20thin%20plume%20and%20sunlight%20glinting%20on%20the%20water?width=1024&height=768&nologo=true&model=flux&seed=93283" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---
## Tipos de erupción y forma del volcán
- Las **erupciones explosivas** proyectan ceniza, bombas y fragmentos piroclásticos.
- Las erupciones efusivas producen coladas fluidas típicas de volcanes escudo.
- Los estratovolcanes combinan capas de lava y ceniza y suelen ser cónicos.
- La viscosidad del magma y el contenido de gases controlan la violencia eruptiva.

<img class="deck-img" src="https://image.pollinations.ai/prompt/photograph%20of%20an%20explosive%20volcanic%20eruption%20with%20a%20tall%20ash%20column%2C%20steam%2C%20and%20dark%20basalt%20slopes%20under%20storm%20light?width=1024&height=768&nologo=true&model=flux&seed=64862" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---
## Riesgos y beneficios
- Los **lahares**, flujos piroclásticos y la ceniza pueden destruir viviendas y afectar la aviación.
- Las cenizas enriquecen suelos y favorecen la agricultura a mediano plazo.
- El calor volcánico alimenta la **geotermia** y el turismo en regiones cercanas.
- La proximidad a volcanes exige planes de evacuación y monitoreo continuo.

<img class="deck-img" src="https://image.pollinations.ai/prompt/aerial%20view%20of%20a%20village%20covered%20in%20gray%20volcanic%20ash%20after%20an%20eruption%2C%20with%20cracked%20roads%2C%20damaged%20roofs%2C%20and%20overcast%20light?width=1024&height=768&nologo=true&model=flux&seed=17109" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">

---
## Monitoreo y predicción
- Se miden sismos, deformación del terreno, gases y temperatura de fumarolas.
- Las redes de sensores permiten emitir alertas tempranas, aunque no una fecha exacta.
- El **monitoreo** continuo reduce el riesgo para poblaciones cercanas.
- Ejemplos: Alaska Volcano Observatory y el Global Volcanism Program.

<img class="deck-img" src="https://image.pollinations.ai/prompt/field%20team%20with%20scientific%20instruments%20near%20a%20volcanic%20vent%2C%20steam%20rising%2C%20tripod%20and%20sensors%2C%20dawn%20light%20on%20dark%20rock?width=1024&height=768&nologo=true&model=flux&seed=2497" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
