# Los volcanes
### Fenómenos que modelan la Tierra y condicionan la vida
---
## Qué es un volcán: estructura y origen
- Un **volcán** es una apertura en la corteza por donde sale **magma** del interior terrestre.
- Se forma sobre zonas de subducción, dorsales oceánicas o puntos calientes.
- Incluye cámara magmática, conducto, cráter y cono volcánico.
- La presión de gases y la ascensión del magma desencadenan la erupción.
<img class="deck-img" src="https://image.pollinations.ai/prompt/aerial%20photograph%20of%20an%20active%20volcanic%20crater%20with%20glowing%20lava%20in%20the%20center%2C%20dark%20rock%20walls%2C%20steam%20rising%2C%20dramatic%20daylight?width=1024&height=768&nologo=true&model=flux&seed=56613" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
---
## Tipos de erupción y formas volcánicas
- Los **estratovolcanes** producen erupciones explosivas con ceniza y lava viscosa.
- Los **escudos** emiten lava fluida y flujos extensos de baja explosividad.
- Los domos crecen por lava espesa que se solidifica cerca del conducto.
- La composición del magma y el contenido de gases definen el estilo eruptivo.
<img class="deck-img" src="https://image.pollinations.ai/prompt/photograph%20of%20a%20steep%20stratovolcano%20with%20layered%20ash%20and%20lava%20flows%2C%20a%20broad%20shield%20volcano%20in%20the%20background%2C%20clear%20sky%2C%20natural%20light?width=1024&height=768&nologo=true&model=flux&seed=20185" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
---
## Riesgos volcánicos y monitoreo
- Las **cenizas**, lahares, gases y flujos piroclásticos son amenazas directas.
- El **monitoreo** usa sismos, deformación del terreno y emisiones de gases.
- Las alertas permiten evacuar y proteger infraestructuras críticas.
- La distancia al cráter y la exposición de la población determinan el nivel de riesgo.
<img class="deck-img" src="https://image.pollinations.ai/prompt/photograph%20of%20a%20barren%20volcanic%20slope%20with%20small%20sensor%20poles%2C%20steam%20vents%2C%20scattered%20dark%20ash%2C%20morning%20light?width=1024&height=768&nologo=true&model=flux&seed=7573" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
---
## Beneficios de la actividad volcánica
- Las **cenizas** enriquecen suelos y favorecen la agricultura en zonas cercanas.
- El **geotermismo** ofrece energía limpia y calor para comunidades enteras.
- La erosión volcánica crea paisajes, minerales y recursos económicos.
- La actividad volcánica participa en el ciclo global de elementos químicos.
<img class="deck-img" src="https://image.pollinations.ai/prompt/photograph%20of%20fertile%20green%20fields%20near%20a%20volcanic%20mountain%2C%20morning%20mist%2C%20sunlight%2C%20no%20people?width=1024&height=768&nologo=true&model=flux&seed=54681" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-failed&quot;)">
---
## Ejemplo reciente y lecciones
- El volcán **Cumbre Vieja** en La Palma generó flujos de lava y evacuaciones en 2021.
- El **monitoreo** anticipó la crisis y redujo pérdidas humanas.
- Las cenizas afectaron aviones, cultivos y redes eléctricas.
- La gestión combinó ciencia, comunicación y planes de emergencia.
