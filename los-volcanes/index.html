# Los volcanes
### Magma, gas y riesgo: entender el pulso de la Tierra

---

## ¿Qué es un volcán?
- Conducto que conecta la cámara magmática con la superficie.
- La erupción expulsa magma, lava, ceniza y gases.
- Su forma depende de la viscosidad y el gas del magma.
- El **magma** y la **presión** definen el tipo de evento.

![](https://image.pollinations.ai/prompt/Close-up%20of%20an%20active%20volcanic%20vent%20at%20dusk%2C%20glowing%20lava%20and%20dark%20basalt%20rocks%2C%20steam%20rising%2C%20no%20people%2C%20no%20text.?width=1024&height=768&nologo=true&seed=67451)


---

## ¿Por qué eruptan?
- El magma asciende cuando la presión supera a la roca circundante.
- El gas disuelto expande y fragmenta el material.
- La posición sobre **placas tectónicas** controla la frecuencia.
- La **presión** de gas puede cambiar una erupción tranquila en violenta.

![](https://image.pollinations.ai/prompt/Aerial%20view%20of%20a%20volcanic%20crater%20with%20steam%20plumes%20and%20fresh%20lava%20flows%2C%20dramatic%20daylight%2C%20no%20text.?width=1024&height=768&nologo=true&seed=73308)


---

## ¿Cómo se clasifican?
- Los volcanes de **escudo** producen lavas fluidas y flujos extensos.
- Los **estratovolcanes** construyen conos altos con capas de lava y ceniza.
- Los conos de ceniza son pequeños y suelen tener actividad breve.
- La composición del magma determina la explosividad.

![](https://image.pollinations.ai/prompt/A%20stratovolcano%20cone%20with%20a%20dark%20lava%20flow%20descending%20its%20flank%2C%20snow%20patches%20on%20the%20summit%2C%20clear%20sky%2C%20no%20text.?width=1024&height=768&nologo=true&seed=82032)


---

## Ejemplo: Vesubio y la ciudad
- En el 79 d. C. sepultó Pompeya y Herculano.
- Lanzó **piroclastos** incandescentes que avanzaron por el flanco.
- La **ceniza** cubrió casas y alteró el clima regional.
- Hoy es un modelo de riesgo urbano cerca de un volcán.

![](https://image.pollinations.ai/prompt/Mount%20Vesuvius%20rising%20above%20hazy%20coastal%20landscape%2C%20ancient%20ruins%20in%20foreground%2C%20warm%20afternoon%20light%2C%20no%20text.?width=1024&height=768&nologo=true&seed=44844)


---

## Impacto: riesgos y beneficios
- Las erupciones generan flujos piroclásticos, lahars y caída de ceniza.
- La **ceniza** puede dañar aviones, cultivos y sistemas de agua.
- Las lavas crean suelos fértiles y paisajes nuevos.
- El calor subterráneo permite **geotermia** y turismo.

![](https://image.pollinations.ai/prompt/Geothermal%20steam%20vents%20in%20a%20volcanic%20valley%2C%20colorful%20mineral%20deposits%2C%20mist%20rising%2C%20no%20people%2C%20no%20text.?width=1024&height=768&nologo=true&seed=13171)


---

## Monitoreo y prevención
- Los **sismógrafos** detectan terremotos volcánicos y ascenso de magma.
- Los sensores de gas y deformación ayudan a anticipar cambios.
- Las **alertas** se emiten por niveles de riesgo, no solo por actividad.
- Los planes de evacuación reducen la mortalidad.

![](https://image.pollinations.ai/prompt/A%20volcano%20observatory%20with%20monitoring%20equipment%20on%20a%20rocky%20slope%2C%20crater%20in%20background%2C%20overcast%20light%2C%20no%20people%2C%20no%20text.?width=1024&height=768&nologo=true&seed=88786)

Reveal.initialize({ hash:true, slideNumber:'c/t', transition:'slide',
  progress:true, controls:true, center:false,
  plugins:[ RevealMarkdown, RevealHighlight ] }).then(function() {
  // Markdown ![](url) no permite onerror inline: engancharlo aqui. Si Pollinations

  document.querySelectorAll('.reveal .slides section img').forEach(function(img) {

  });
