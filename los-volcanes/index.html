<style>
:root {
  --bg1:#0f172a; --bg2:#1e1b4b; --bg3:#312e81;

}
:root{--accent:hsl(153,80%,72%);--accent2:hsl(198,85%,64%);--muted:hsl(153,40%,82%);--bg3:hsl(153,48%,24%);}
html, body { height:100%; }
.reveal-viewport {
  background: radial-gradient(1200px 800px at 15% 10%, var(--bg3) 0%, transparent 55%),

              linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
}
.reveal { font-family:'Inter',system-ui,sans-serif; color:var(--ink); font-size:30px; }
.reveal .slides { text-align:left; }
.reveal .slides section { padding:0 24px; }
.reveal h1, .reveal h2, .reveal h3 {
  font-family:'Poppins',sans-serif; color:#fff; text-transform:none;
  letter-spacing:-.01em; line-height:1.1; text-shadow:0 2px 18px rgba(0,0,0,.35);
}
.reveal h1 { font-size:2.4em; font-weight:800;
  background:linear-gradient(90deg,#fff, var(--muted));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.reveal h2 { font-size:1.5em; font-weight:700; margin-bottom:.5em;
  border-left:6px solid var(--accent); padding-left:.5em; }
.reveal p, .reveal li { color:var(--ink); line-height:1.45; }
.reveal strong { color:var(--accent2); }
.reveal em { color:var(--muted); }
.reveal ul { display:block; margin-left:.2em; }
.reveal ul li { margin:.35em 0; list-style:none; position:relative; padding-left:1.3em; }
.reveal ul li::before { content:'▸'; position:absolute; left:0; color:var(--accent); font-weight:700; }
.reveal a { color:var(--accent2); }
/* imagenes de contenido (Markdown ![](url)): al lado del texto (fluye a la izquierda) */
.reveal .slides section img {
  float:right; width:40%; max-width:40%; max-height:64vh;
  margin:.1em 0 .6em 1.1em; min-height:8em;
  border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12); object-fit:cover;
  /* mientras carga: panel de color (no blanco) */
  background:linear-gradient(135deg, var(--bg3), #4c1d95);
}
.reveal .slides section img.img-failed { display:none; }  /* si Pollinations falla, ocultar (JS) */
.reveal .slides section p:has(img) { margin:0; }          /* el <p> que envuelve la imagen no estorba */
.reveal .slides section::after { content:''; display:block; clear:both; }  /* clearfix del float */
/* portada: primer slide centrado (la imagen, si la hay, no flota) */
.reveal .slides > section:first-child { text-align:center; }
.reveal .slides > section:first-child h1 { margin-bottom:.2em; }
.reveal .slides > section:first-child p { color:var(--muted); font-size:1.1em; }
.reveal .slides > section:first-child img {
  float:none; width:auto; max-width:70%; max-height:40vh; margin:.6em auto 0;
}
/* referencias APA7: sangria francesa */
.reveal .references { font-size:.62em; }
.reveal .references p {

# Los volcanes
### Gigantes de fuego que moldean la Tierra

---

## Qué es un volcán
- Un volcán es una abertura en la corteza por donde sale **magma**
- El magma al enfriarse forma roca y gases volcánicos
- Su actividad depende de placas tectónicas y cámaras magmáticas
- Puede ser activo, inactivo o extinto

![](https://image.pollinations.ai/prompt/A%20volcanic%20vent%20on%20a%20mountainside%20at%20dawn%2C%20glowing%20lava%20flow%20and%20dark%20basalt%20rocks%2C%20dramatic%20low-angle%20light%2C%20photographic%20style?width=1024&height=768&nologo=true&seed=47856)


---

## Tipos de erupción
- Las **efusivas** expulsan lava fluida y forman coladas
- Las **explosivas** lanzan ceniza, piroclastos y gases
- El tipo de magma y su viscosidad determinan el peligro
- Ejemplo: Islandia con coladas lentas; Pinatubo con erupción violenta

![](https://image.pollinations.ai/prompt/An%20explosive%20volcanic%20eruption%20with%20a%20dark%20ash%20column%20rising%20above%20a%20forested%20mountain%2C%20overcast%20sky%2C%20strong%20side%20lighting%2C%20photographic%20style?width=1024&height=768&nologo=true&seed=69780)


---

## Por qué se forman
- Se generan donde las placas tectónicas divergen, convergen o hay puntos calientes
- El **magma** asciende por presiones internas y fracturas
- La composición química define la explosividad
- La historia geológica deja registros en capas de ceniza

![](https://image.pollinations.ai/prompt/Aerial%20view%20of%20a%20rift%20valley%20with%20fresh%20lava%20flows%20and%20steam%20vents%2C%20rugged%20volcanic%20terrain%2C%20golden%20hour%20light%2C%20photographic%20style?width=1024&height=768&nologo=true&seed=70682)


---

## Riesgos y beneficios
- Riesgos: ceniza, lahars, gases tóxicos y tsunamis volcánicos
- Beneficios: suelos fértiles, geotermia y minerales
- La **vigilancia** reduce daños con redes de sensores
- La evacuación temprana salva vidas

![](https://image.pollinations.ai/prompt/A%20village%20near%20a%20volcanic%20mountain%20with%20ash-covered%20roofs%20and%20a%20warning%20siren%2C%20morning%20light%2C%20documentary%20photographic%20style?width=1024&height=768&nologo=true&seed=63927)


---

## Ejemplo: el Vesubio
- En el 79 d.C. destruyó Pompeya y Herculano
- La erupción combinó flujos **piroclásticos** y caída de ceniza
- Su historia muestra el poder de los volcanes activos
- Hoy se estudia para predecir crisis futuras

![](https://image.pollinations.ai/prompt/A%20large%20volcanic%20cone%20overlooking%20a%20Mediterranean%20coastal%20town%2C%20ash-gray%20sky%20and%20warm%20sunlight%20on%20ancient%20ruins%2C%20photographic%20style?width=1024&height=768&nologo=true&seed=85696)

<script>
Reveal.initialize({ hash:true, slideNumber:'c/t', transition:'slide',
  progress:true, controls:true, center:false,
  plugins:[ RevealMarkdown, RevealHighlight ] }).then(function() {
  // Pollinations (gratis) LIMITA rafagas: si las 6 imagenes se piden a la vez, casi
  // todas fallan. Estrategia: NO cargar de golpe -> mover src a data-src y cargar solo
  // la del slide visible (y la siguiente) al mostrarse. Reintento escalonado por si
  // una falla (la 2a vez suele venir de cache, rapida). Markdown ![](url) no permite
  // onerror inline, por eso se engancha aqui.
  var imgs = document.querySelectorAll('.reveal .slides section img');
  imgs.forEach(function(img) { img.dataset.src = img.src; img.removeAttribute('src'); });
  function load(sec) {
    if (!sec) return;
    sec.querySelectorAll('img[data-src]').forEach(function(img) {
      var url = img.dataset.src; img.removeAttribute('data-src');
      var tries = 0;
      img.addEventListener('error', function() {
        if (tries++ < 6) { setTimeout(function() { img.src = ''; img.src = url; }, 1200 * tries); }
        else { img.classList.add('img-failed'); }
      });
      img.src = url;
    });
  }
  Reveal.on('slidechanged', function(e) { load(e.currentSlide); load(e.currentSlide.nextElementSibling); });
  load(Reveal.getCurrentSlide());
  load(document.querySelectorAll('.reveal .slides section')[1]);  // precargar el 1er contenido
});
</script>
