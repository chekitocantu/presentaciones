# Los volcanes
### Fenómenos que moldean el planeta

---

## Qué es un volcán
- Un **volcán** es una abertura donde sale magma, gas y ceniza.
- El magma se convierte en **lava** al llegar a la superficie.
- Su actividad depende de la profundidad y viscosidad del magma.
- Puede ser activo, inactivo o extinto según su historial.

![](https://image.pollinations.ai/prompt/A%20close-up%20of%20a%20volcanic%20vent%20emitting%20red%20lava%20and%20dark%20smoke%20under%20a%20night%20sky%2C%20with%20rugged%20basalt%20rocks%20in%20the%20foreground.?width=1024&height=768&nologo=true&model=flux&seed=43185)


---

## Por qué se forman
- Se forman donde las placas tectónicas se separan, chocan o hay puntos calientes.
- La **subducción** hunde placas y genera fusión en el manto.
- Las dorsales oceánicas crean cadenas de islas volcánicas.
- La presión de gases acelera la erupción.

![](https://image.pollinations.ai/prompt/Aerial%20photograph%20of%20a%20volcanic%20island%20chain%20in%20a%20blue%20ocean%2C%20with%20white%20steam%20rising%20from%20dark%20rocky%20slopes%20and%20green%20vegetation.?width=1024&height=768&nologo=true&model=flux&seed=96950)


---

## Tipos de erupciones
- Las **erupciones efusivas** vierten lava fluida con poca explosividad.
- Las **explosivas** lanzan ceniza, piroclastos y gases a gran altura.
- El índice VEI mide la magnitud de la erupción.
- El tipo de magma determina el riesgo y el paisaje resultante.

![](https://image.pollinations.ai/prompt/A%20dramatic%20volcanic%20ash%20plume%20rising%20above%20a%20crater%2C%20with%20dark%20clouds%20and%20scattered%20ash%20over%20a%20barren%20landscape%2C%20photographed%20from%20a%20distance.?width=1024&height=768&nologo=true&model=flux&seed=55307)


---

## Riesgos y beneficios
- La **ceniza** puede dañar aviones, cultivos y respiración.
- Los **lahares** son flujos de lodo volcánico muy rápidos.
- Las erupciones generan gases que afectan el clima.
- El suelo volcánico es fértil y hay geotermia.

![](https://image.pollinations.ai/prompt/A%20river%20of%20muddy%20volcanic%20debris%20flowing%20down%20a%20steep%20slope%20after%20an%20eruption%2C%20with%20dark%20ash-covered%20ground%20and%20trees%20partially%20buried%20in%20soft%20daylight.?width=1024&height=768&nologo=true&model=flux&seed=85930)


---

## Cómo se monitorean
- Se miden **sismos**, deformación y gases volcánicos.
- Los sensores detectan cambios en la temperatura del terreno.
- Las cámaras y satélites siguen nubes de ceniza y lava.
- Los avisos tempranos permiten evacuar a tiempo.

![](https://image.pollinations.ai/prompt/A%20volcano%20observatory%20with%20scientific%20instruments%20and%20a%20small%20building%20overlooking%20a%20smoking%20crater%2C%20with%20clear%20sky%20and%20rugged%20terrain.?width=1024&height=768&nologo=true&model=flux&seed=62810)


---

## Ejemplo: erupciones recientes
- El **Etna** muestra actividad frecuente en Sicilia.
- El Fuego en Guatemala produce flujos de lava recurrentes.
- El Kilauea en Hawái genera erupciones efusivas.
- El Vesuvio sigue siendo un riesgo para Nápoles.

![](https://image.pollinations.ai/prompt/A%20wide%20view%20of%20a%20volcano%20with%20glowing%20lava%20flows%20descending%20its%20slopes%20at%20dusk%2C%20with%20a%20town%20visible%20in%20the%20distance%20and%20smoke%20rising%20from%20the%20summit.?width=1024&height=768&nologo=true&model=flux&seed=45982)
